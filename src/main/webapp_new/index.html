<!DOCTYPE html>
<html>
    <head>
        <title>Liar's Dice Tester v4</title>
        <link rel="icon" type="image/x-icon" href="./favicon.png">
        <link rel="stylesheet" href="./styles.css">
    </head>

    <body>
        <section class="connection-info-main">
            <div class="input-field-group">
                <input placeholder="Target IP" class="input-field ip">
                <input placeholder="Port" class="input-field port">
            </div>

            <p class="client-status-indicator">PLACEHOLDER</p>

            <div class="btn-group">
                <button class="connect">Connect</button>
                <button class="disconnect">Disconnect</button>
            </div>
        </section>

        <section class="connection-info-misc">
            <div class="auth-token-info">
                <label>Auth Token</label>
                <input class="input-field" placeholder="Fill in if applicable" disabled>
            </div>

            <div class="namespace-info">
                <label>Namespace</label>
                <input class="input-field" placeholder="Fill in if applicable" disabled>
            </div>
        </section>

        <section class="send-recv-options-main">
            <div class="send-options">
                <div class="first-row">
                    <label>Net Code</label>
                    <input class="input-field" id="data-section-send-input-netcode">
                    <button class="execute-btn" onclick="sendToServer()">Send</button>
                </div>

                <div class="second-row">
                    <label>Body</label>
                    <textarea class="input-textarea" id="data-section-send-input-body" rows="10"></textarea>
                    <button class="clear-btn" onclick="clearBody()">Clear</button>
                </div>
            </div>

            <div class="recv-options">
                <div class="first-row">
                    <label>Event(s)</label>
                    <input class="input-field" id="data-section-recv-input-event">
                    <button class="execute-btn" onclick="createNewEventEntry()">Listen</button>
                </div>

                <div class="second-row">
                    <label>Binded list</label>
                    <div class="list-display-area" id="data-section-recv-event-list"></div>
                </div>
            </div>
        </section>

        <section class="console-output-main">
            <div class="btn-group">
                <button>🔥</button>
                <button>🔥</button>
            </div>
            <textarea class="console-display-area" rows="18" id="console-component" readonly placeholder="Nothing at the moment..."></textarea>
        </section>
    </body>
</html>
