<!DOCTYPE html>
<html>
    <head>
        <title>Liar's Dice Tester v4</title>
        <link rel="icon" type="image/x-icon" href="./favicon.png">
        <link rel="stylesheet" href="./styles.css">
    </head>

    <body>
        <section class="connection-info-main">
            <div class="input-field-group">
                <input placeholder="Target IP" class="input-field ip" id="input_ip">
                <input placeholder="Port" class="input-field port" id="input_port">
            </div>

            <p class="client-status-indicator" id="comp_status_indicator">IDLE</p>

            <div class="btn-group">
                <button class="connect" id="btn_connect" onclick="ClientConnect()">Connect</button>
                <button class="disconnect" id="btn_disconnect" onclick="ClientDisconnect()" disabled>Disconnect</button>
            </div>
        </section>

        <section class="connection-info-misc">
            <div class="auth-token-info">
                <label>Auth Token</label>
                <input class="input-field" placeholder="Fill in if applicable" disabled id="input_authtoken">
            </div>

            <div class="namespace-info">
                <label>Namespace</label>
                <input class="input-field" placeholder="Fill in if applicable" disabled id="input_namespace">
            </div>
        </section>

        <section class="send-recv-options-main">
            <div class="send-options">
                <div class="first-row">
                    <label>Net Code</label>
                    <input class="input-field" id="input_netcode">
                    <button class="execute-btn" onclick="sendToServer()" id="btn_sendnetcode" disabled>Send</button>
                </div>

                <div class="second-row">
                    <label>Body</label>
                    <textarea class="input-textarea" rows="10" id="input_netbody"></textarea>
                    <button class="clear-btn" onclick="clearBody()" id="btn_clearnetbody">Clear</button>
                </div>
            </div>

            <div class="recv-options">
                <div class="first-row">
                    <label>Event(s)</label>
                    <input class="input-field" id="input_recv_event">
                    <button class="execute-btn" onclick="createNewEventEntry()" id="btn_addnewevent">Listen</button>
                </div>

                <div class="second-row">
                    <label>Binded list</label>
                    <div class="list-display-area" id="display_eventlist"></div>
                </div>
            </div>
        </section>

        <section class="console-output-main">
            <div class="btn-group">
                <button onclick="clearConsole()">🔥</button>
                <button onclick="clearConsole()">🔥</button>
            </div>
            <textarea class="console-display-area" rows="18" id="display_console" readonly placeholder="Nothing at the moment..."></textarea>
        </section>
    </body>
    
    <!-- Run JS scripts -->
    <script src="./scripts/socket.io.js"></script>
    <script src="./scripts/components.js"></script>
    <script src="./scripts/utils.js"></script>
    <script src="./scripts/client.js"></script>
</html>
