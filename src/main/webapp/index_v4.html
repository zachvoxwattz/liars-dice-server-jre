<!DOCTYPE html>
<html>
    <head>
        <title>Liar's Dice Tester v4</title>
        <link rel="icon" type="image/x-icon" href="./favicon.png">
        <link rel="stylesheet" href="./styles.css">
    </head>

    <body>
        <section class="connection-section">
            <div class="input-div">
                <input class="input-field" id="connection-section-input-ip" placeholder="Target IP" maxlength="15">
                <input class="input-field" id="connection-section-input-port" placeholder="Port" maxlength="5">
            </div>

            <h3 id="connection-section-status-value">IDLE</h3>
            
            <div class="button-div">
                <button id="connection-section-button-connect" onclick="connectToServer()">Connect</button>
                <button id="connection-section-button-disconnect" onclick="userDisconnect()">Disconnect</button>
            </div>
        </section>

        <section class="data-section">
            <div class="send-operation-div">
                <div class="send-operation-netcode-div">
                    <div class="input-div">
                        <p>Net Code:</p>
                        <input id="data-section-send-input-netcode">    
                    </div>
                    <button onclick="sendToServer()">Send</button>
                </div>

                <div class="send-operation-body-div">
                    <p>Body Content:</p>
                    <textarea id="data-section-send-input-body" rows="10"></textarea>
                </div>
            </div>

            <div class="recv-operation-div">
                <div class="recv-operation-event-div">
                    <div class="input-div">
                        <p>Event:</p>
                        <input id="data-section-recv-input-event">
                    </div>
                    <button onclick="createNewEventEntry()">Listen</button>
                </div>

                <div class="recv-operation-body-div">
                    <p>Binded List:</p>
                    <div id="data-section-recv-event-list"></div>
                </div>
            </div>
        </section>

        <section class="console-section">
            <div class="clear-button-div">
                <button id="console-section-button-clear" onclick="clearConsole()">🔥</button>
                <button id="console-section-button-clear" onclick="clearConsole()">🔥</button>
            </div>
            <textarea id="console-component" readonly placeholder="Nothing at the moment..."></textarea>
        </section>
    </body>

    <!--Retrieves all of the elements in the DOM and declares various functions to be used-->
    <script src="./scripts/v4.8.1/components.js"></script>
    <script src="./scripts/v4.8.1/functions.js"></script>

    <!-- Executes the Socket.IO source script and the main script -->
    <script src="./scripts/v4.8.1/socket.io.min.js"></script>
    <script src="./scripts/v4.8.1/client.js"></script>
</html>
